version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kirana_postgres
    restart: always
    environment:
      POSTGRES_USER: kirana_user
      POSTGRES_PASSWORD: kirana_password
      POSTGRES_DB: kirana_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kirana_user -d kirana_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kirana_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kirana_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://kirana_user:kirana_password@postgres:5432/kirana_db?schema=public
      JWT_SECRET: kirana-super-secret-jwt-key-minimum-32-chars-long!
      JWT_EXPIRES_IN: 7d
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kirana_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  pgdata:
  redisdata:
